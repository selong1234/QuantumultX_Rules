#!name=微信小程序去广告（车来了 + 通用）
#!desc=针对微信小程序广告：车来了信息流/底栏/开屏，以及微信小程序通用广告接口
#!author=本地整理（车来了部分整合 ddgksf2013 / zirawell 规则）
#!homepage=https://github.com/zirawell/R-Store
#!date=2025-10-19
#!system=iOS
#!tag=去广告,微信小程序,车来了
#!remark=本文件为 Quantumult X「重写」资源，末行 hostname 会自动并入 MITM 列表
#!remark=reject 变体说明：reject(404空) / reject-200(200空) / reject-dict(200 + {}) / reject-array(200 + []) / reject-img(200 + 1px 透明图)
#!remark=前端若不判状态码，用 reject 会弹"网络异常"，故本文件统一优先用 reject-200 / reject-dict / reject-img

# ======================================================================================
# 一、车来了（App 与微信小程序共用域名，规则同时生效）
#     分流层的整域拒绝见 QX-wechat-applet-adblock.list
# ======================================================================================

# > 通用广告接口（开屏 / banner / 插屏）
^https?:\/\/api\.chelaile\.net\.cn\/adpub url reject-200
^https?:\/\/web\.chelaile\.net\.cn\/api\/adpub url reject-200
^https?:\/\/cdn\.\w{2,5}\.chelaileapp\.cn\/(api\/)?adpub url reject-200
^https?:\/\/api\.chelaile\.net\.cn\/goocity\/advert url reject-dict

# > 广告位图片：返回 1px 透明图，避免前端留出空白块
^https?:\/\/pic\d{1,2}\.chelaile\.net\.cn\/adv\/ url reject-img

# > 公交详情页 / 线路详情页 信息流广告
^https?:\/\/web\.chelaile\.net\.cn\/api\/operative_position\/infoflow url reject-200
^https?:\/\/cdn\.web\.chelaile\.net\.cn\/info-flow\/index\.html url reject-200

# > 「我的」页面 广告卡片位
^https?:\/\/[a-z0-9.-]*chelaile\.net\.cn\/goocity\/flowPos\/listByPos url reject-200

# > 硬编码直连 IP 兜底（域名被绕过时仍能拦到）
^https?:\/\/124\.70\.194\.16\/(ip|adpub|goocity\/flowPos\/listByPos) url reject-200

# > 底栏广告：该接口的 jsonr.data.cityList 里混着「首页/我的」等正常 tab，
#   纯 reject 会把整个底栏清掉，必须用脚本只剔除广告项
^https?:\/\/[a-z0-9.-]*chelaile\.net\.cn\/goocity\/city! url script-response-body https://cdn.jsdelivr.net/gh/ddgksf2013/Scripts@master/chelaile.js

# ======================================================================================
# 二、微信小程序通用广告接口
# ======================================================================================

# > 小程序横幅 / 浮层广告位
^https?:\/\/mp\.weixin\.qq\.com\/wapad\/getaddata\?action=getad url reject-200
^https?:\/\/mp\.weixin\.qq\.com\/wapad\/reportaddata\?action=exposure_report url reject-200

# > 【可选】公众号图文内广告，若不需要可整行注释掉
# ^https?:\/\/mp\.weixin\.qq\.com\/mp\/getappmsgad url reject-dict

# ======================================================================================
# 三、MITM 证书解密主机名
#   车来了用整域通配，避免 pic1/pic2/cdn.xxx 等子域遗漏
# ======================================================================================
hostname = *.chelaile.net.cn, chelaile.net.cn, *.chelaileapp.cn, mp.weixin.qq.com
